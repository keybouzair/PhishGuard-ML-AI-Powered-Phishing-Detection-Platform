<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 350px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 400px;
        }
        
        .container {
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .current-url {
            word-break: break-all;
            font-size: 12px;
            color: #666;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            max-height: 60px;
            overflow: hidden;
        }
        
        .status-container {
            text-align: center;
            padding: 20px;
        }
        
        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .status-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .status-score {
            font-size: 14px;
            color: #666;
        }
        
        .safe {
            color: #28a745;
        }
        
        .warning {
            color: #ffc107;
        }
        
        .danger {
            color: #dc3545;
        }
        
        .checking {
            color: #007bff;
        }
        
        .check-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .check-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .input-container {
            margin-bottom: 15px;
        }
        
        .input-container input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-container input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-number {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
        }
        
        .details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
        }
        
        .detail-label {
            color: #666;
        }
        
        .detail-value {
            font-weight: 500;
        }
        
        .footer {
            text-align: center;
            color: white;
            font-size: 11px;
            opacity: 0.8;
            padding: 10px;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
        }
        
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        
        .toggle-label {
            font-size: 14px;
            color: #333;
        }
        
        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 26px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .risk-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .risk-fill {
            height: 100%;
            transition: width 0.5s ease, background 0.5s ease;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Phishing Detector</h1>
            <p>AI-Powered URL Security Scanner</p>
        </div>
        
        <div class="card">
            <div class="current-url" id="currentUrl">Loading...</div>
            
            <div class="status-container" id="statusContainer">
                <div class="status-icon checking" id="statusIcon">🔍</div>
                <div class="status-text checking" id="statusText">Ready to Scan</div>
                <div class="status-score" id="statusScore">Click below to check this URL</div>
                <div class="risk-bar hidden" id="riskBar">
                    <div class="risk-fill" id="riskFill"></div>
                </div>
            </div>
            
            <button class="check-btn" id="checkBtn">
                🔍 Check Current Page
            </button>
            
            <div class="details hidden" id="details">
                <div class="detail-item">
                    <span class="detail-label">Threat Score</span>
                    <span class="detail-value" id="threatScore">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Domain Age</span>
                    <span class="detail-value" id="domainAge">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">SSL Status</span>
                    <span class="detail-value" id="sslStatus">-</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="input-container">
                <input type="url" id="urlInput" placeholder="Or enter a URL to check...">
            </div>
            <button class="check-btn" id="checkUrlBtn" style="background: #28a745;">
                🔗 Check URL
            </button>
        </div>
        
        <div class="card">
            <div class="toggle-container">
                <span class="toggle-label">Auto-scan pages</span>
                <label class="toggle">
                    <input type="checkbox" id="autoScan">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-container">
                <span class="toggle-label">Show notifications</span>
                <label class="toggle">
                    <input type="checkbox" id="showNotifications" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalScans">0</div>
                    <div class="stat-label">Scanned</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number safe" id="safeCount">0</div>
                    <div class="stat-label">Safe</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number danger" id="blockedCount">0</div>
                    <div class="stat-label">Blocked</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by Machine Learning | <a href="#" id="openDashboard">Open Dashboard</a></p>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
